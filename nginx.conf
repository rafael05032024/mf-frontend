server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml font/woff2;

    # Assets com hash no nome: cache longo e imutável
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # config.js e gerado no boot: nunca em cache
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html nunca em cache, para o deploy novo ser visto na hora
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: qualquer rota do react-router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
